name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: CLI smoke test
        run: deadletter tests/fixtures/orders/template.yaml --format json --fail-on none

  # The benchmark is the only external claim this repository makes. Left
  # unchecked it rots quietly: a competitor ships a rule, the table keeps
  # saying they miss the defect, and the first person to notice is a prospect.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Install Deadletter and the tools it is measured against
        run: |
          python -m pip install -e ".[dev]" checkov cfn-lint-serverless
          npm install --prefix docs/benchmark
      - name: Check the benchmark still matches what the tools report
        run: python docs/benchmark/run_benchmark.py --check
