[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadletter"
version = "0.1.0"
description = "Pre-deployment event-delivery correctness scanner for AWS event-driven architectures"
requires-python = ">=3.12"
dependencies = [
    "cfn-lint>=1.0",
    "cfn-flip>=1.3",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
deadletter = "deadletter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
