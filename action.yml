name: Deadletter event-delivery scan
description: Scan a CloudFormation or SAM template for cross-resource event-delivery defects.
branding:
  icon: alert-triangle
  color: orange

inputs:
  template:
    description: Path to a CloudFormation or SAM template, or a directory to search.
    required: true
  show-suppressed:
    description: Include findings waived by template metadata in a text report.
    required: false
    default: "false"
  policy:
    description: >-
      Which findings are allowed to BLOCK: 'default' blocks only confirmed
      violations of AWS requirements, 'strict' also blocks recommended
      safeguards and IAM-inferred findings, 'advisory' blocks nothing.
    required: false
    default: default
  fail-on:
    description: Lowest verdict that fails the step (BLOCK, WARN, INFO, or none).
    required: false
    default: BLOCK
  format:
    description: Report format (text, json, sarif, or mermaid).
    required: false
    default: text
  output:
    description: Optional report file path. Leave empty to print to the workflow log.
    required: false
    default: ""
  allow-empty:
    description: Exit 0 when the path holds no templates instead of failing the step.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install Deadletter
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Scan template
      shell: bash
      env:
        DEADLETTER_TEMPLATE: ${{ inputs.template }}
        DEADLETTER_POLICY: ${{ inputs.policy }}
        DEADLETTER_FAIL_ON: ${{ inputs.fail-on }}
        DEADLETTER_FORMAT: ${{ inputs.format }}
        DEADLETTER_OUTPUT: ${{ inputs.output }}
        DEADLETTER_SHOW_SUPPRESSED: ${{ inputs.show-suppressed }}
        DEADLETTER_ALLOW_EMPTY: ${{ inputs.allow-empty }}
      run: |
        args=(
          "$DEADLETTER_TEMPLATE"
          --policy "$DEADLETTER_POLICY"
          --fail-on "$DEADLETTER_FAIL_ON"
          --format "$DEADLETTER_FORMAT"
        )
        if [[ -n "$DEADLETTER_OUTPUT" ]]; then
          args+=(--output "$DEADLETTER_OUTPUT")
        fi
        if [[ "$DEADLETTER_SHOW_SUPPRESSED" == "true" ]]; then
          args+=(--show-suppressed)
        fi
        if [[ "$DEADLETTER_ALLOW_EMPTY" == "true" ]]; then
          args+=(--allow-empty)
        fi
        deadletter "${args[@]}"
