name: Deadletter event-delivery scan
description: Scan a CloudFormation or SAM template for cross-resource event-delivery defects.
branding:
  icon: alert-triangle
  color: orange

inputs:
  template:
    description: Path to the CloudFormation or SAM template.
    required: true
  fail-on:
    description: Lowest severity that fails the step (BLOCK, WARN, INFO, or none).
    required: false
    default: BLOCK
  format:
    description: Report format (text, json, sarif, or mermaid).
    required: false
    default: text
  output:
    description: Optional report file path. Leave empty to print to the workflow log.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install Deadletter
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Scan template
      shell: bash
      env:
        DEADLETTER_TEMPLATE: ${{ inputs.template }}
        DEADLETTER_FAIL_ON: ${{ inputs.fail-on }}
        DEADLETTER_FORMAT: ${{ inputs.format }}
        DEADLETTER_OUTPUT: ${{ inputs.output }}
      run: |
        args=("$DEADLETTER_TEMPLATE" --fail-on "$DEADLETTER_FAIL_ON" --format "$DEADLETTER_FORMAT")
        if [[ -n "$DEADLETTER_OUTPUT" ]]; then
          args+=(--output "$DEADLETTER_OUTPUT")
        fi
        deadletter "${args[@]}"
