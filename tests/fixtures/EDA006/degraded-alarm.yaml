AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Regression fixture. Every dead-letter queue here has an alarm that names it,
  and not one of those alarms can tell anybody the queue is filling:

    WrongMetricAlarm   measures empty receives, which says nothing about depth
    DisabledAlarm      measures depth, with ActionsEnabled false
    NoActionAlarm      measures depth, enabled, with nowhere to send anything

  Matching on the dimension alone reports all three as coverage and returns no
  findings — which is how a scanner tells somebody they are safe when the
  messages are about to expire.
Resources:
  OncallTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: oncall

  WrongMetricQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: wrong-metric-queue
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WrongMetricDlq.Arn
        maxReceiveCount: 5
  WrongMetricDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: wrong-metric-dlq
      MessageRetentionPeriod: 1209600
  WrongMetricAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: wrong-metric
      Namespace: AWS/SQS
      MetricName: NumberOfEmptyReceives
      Dimensions:
        - Name: QueueName
          Value: !GetAtt WrongMetricDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: true
      AlarmActions:
        - !Ref OncallTopic

  DisabledQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: disabled-queue
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DisabledDlq.Arn
        maxReceiveCount: 5
  DisabledDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: disabled-dlq
      MessageRetentionPeriod: 1209600
  DisabledAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: disabled
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DisabledDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: false
      AlarmActions:
        - !Ref OncallTopic

  NoActionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: no-action-queue
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NoActionDlq.Arn
        maxReceiveCount: 5
  NoActionDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: no-action-dlq
      MessageRetentionPeriod: 1209600
  NoActionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: no-action
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NoActionDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: true

  DrainWrongMetric:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handle
      Runtime: python3.12
      Timeout: 30
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt WrongMetricQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
  DrainDisabled:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handle
      Runtime: python3.12
      Timeout: 30
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt DisabledQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
  DrainNoAction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handle
      Runtime: python3.12
      Timeout: 30
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt NoActionQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
