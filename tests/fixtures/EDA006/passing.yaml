AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Two dead-letter queues, both accounted for. PaymentDlq has a redrive consumer
  that pulls messages back out. ShippingDlq has no consumer but is alarmed on
  depth, so a human is told while the messages are still there.
Resources:
  PaymentQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: payment-queue
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PaymentDlq.Arn
        maxReceiveCount: 5
  PaymentDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: payment-dlq
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ParkingLotQueue.Arn
        maxReceiveCount: 3
  ParkingLotQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: parking-lot
      MessageRetentionPeriod: 1209600
  ParkingLotAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: parking-lot-not-empty
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ParkingLotQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
  ShippingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: shipping-queue
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ShippingDlq.Arn
        maxReceiveCount: 5
  ShippingDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: shipping-dlq
      MessageRetentionPeriod: 1209600
  ShippingDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: shipping-dlq-not-empty
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ShippingDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
  SettlePaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.settle
      Runtime: python3.12
      Timeout: 30
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt PaymentQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
  RedrivePaymentDlqFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.redrive
      Runtime: python3.12
      Timeout: 30
      Events:
        FromDlq:
          Type: SQS
          Properties:
            Queue: !GetAtt PaymentDlq.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
  ShipOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.ship
      Runtime: python3.12
      Timeout: 30
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt ShippingQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
