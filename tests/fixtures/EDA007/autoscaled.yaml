AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Same shape as violating.yaml, with an Application Auto Scaling target on the
  table's write capacity.

  The rule used to return early here: a scaling target existed, so the ceiling
  was treated as movable. AWS documents that scaling reacts over minutes and
  stops at MaxCapacity, so it does not absorb a burst that arrives in seconds.
  The target belongs in the finding's assumptions, where a reader can weigh it.
Resources:
  OncallTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: oncall
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: events
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
  EventsTableWriteTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: dynamodb
      ScalableDimension: "dynamodb:table:WriteCapacityUnits"
      ResourceId: !Sub "table/${EventsTable}"
      MinCapacity: 5
      MaxCapacity: 40
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/dynamodb.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_DynamoDBTable"
  IngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ingest-queue
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestDlq.Arn
        maxReceiveCount: 5
  IngestDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ingest-dlq
      MessageRetentionPeriod: 1209600
  IngestDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ingest-dlq-not-empty
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IngestDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: true
      AlarmActions:
        - !Ref OncallTopic
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.ingest
      Runtime: python3.12
      Timeout: 30
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref EventsTable
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt IngestQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
